<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — PulseBoard</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #04060b;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .code {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.22em;
      color: #475569;
    }
    .frame {
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 46px 28px;
      background: rgba(255, 255, 255, 0.02);
    }
    .wordmark {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 26px;
    }
    .wordmark::after {
      content: '';
      display: block;
      width: 34px;
      height: 2px;
      background: #f59e0b;
      margin: 18px auto 0;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: 26px;
      line-height: 1.35;
      color: #f8fafc;
      margin-bottom: 12px;
    }
    p {
      font-size: 14.5px;
      line-height: 1.65;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    a.home {
      display: inline-block;
      text-decoration: none;
      color: #f59e0b;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 12px 26px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 9999px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    a.home:hover, a.home:active { background: #f59e0b; color: #04060b; }
    .back {
      display: inline-block; margin-top: 14px; background: none; border: none; cursor: pointer;
      color: #94a3b8; font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
      padding: 10px 18px; text-decoration: underline; text-underline-offset: 4px;
      font-family: inherit;
    }
    .back:hover, .back:active { color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="code">404 &middot; NOT FOUND</div>
  <main class="frame">
    <div class="wordmark">PulseBoard</div>
    <h1>This page drifted off-orbit.</h1>
    <p>Whatever you were looking for isn&rsquo;t on the station. The briefing itself is safe and on schedule.</p>
    <a class="home" href="/">Return to the briefing</a>
    <div><button class="back" onclick="history.back()">Go back</button></div>
  </main>
</body>
</html>
